# deploy.yml의 최상단
env:
  S3_BUCKET_NAME: pnow-s3-bucket
  PROJECT_NAME: PNOW

name: deploy # workflows의 이름

# Event : 실행되는 시점을 설정
# main 브랜치에 push 될 때 아래 Workflow 로직 실행
on:
  push:
    branches: [ main ]

# 하나의 workflow는 1개 이상의 Job으로 구성된다.
# 여러 Job은 기본적으로 병렬적으로 수행된다.
jobs:
  # Job을 식별하기 위한 id
  build:
    # 우분투 환경 / 가장 최신 버전(latest)
    runs-on: ubuntu-latest

    # Step : 특정 작업을 수행하는 가장 작은 단위
    # Job은 여러 Step으로 구성되어 있다.
    steps:
      - name: Checkout
        uses: actions/checkout@v3 # 프로젝트 코드를 Checkout

      - name: Set up JDK 11
        uses: actions/setup-java@v3 # Github Action이 실행될 OS에 Java 11 설치
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew # gradle wrapper를 실행할 수 있도록 실행 권한 부여
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build -x test # gradle wrapper를 통해 해당 프로젝트를 테스트 빼고 build
        shell: bash

      # 추가 작성
      - name: Get current time
        uses: 1466587594/get-current-time@v2  # UTC -> KST
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

      - name: Show Current Time
        run: echo "CurrentTime=${{steps.current-time.outputs.formattedTime}}" # 포맷 지정
        shell: bash

      - name: Make zip file
        run: zip -r ./$PROJECT_NAME.zip .         # 프로젝트 이름으로 해당 폴더를 모두 압축
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1      # aws에 해당 키 값으로 접속 진행
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 cp --region ap-northeast-2 ./$PROJECT_NAME.zip s3://$S3_BUCKET_NAME/$PROJECT_NAME/$PROJECT_NAME.zip    # s3에 프로젝트 이름에 해당하는 폴더에 zip 파일 저장